[project]
name = "bandhack"
version = "0.1.0"
description = "Self-assembling incident war rooms on Band"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "band-sdk[anthropic,claude-sdk,codex,google-adk,langgraph,pydantic-ai]>=0.2.11,<1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "langchain-openai>=0.3",
    "langgraph>=0.2",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sentence-transformers>=5.5.1",
    "code2flow>=2.5.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
bandhack-watchdog = "agents.watchdog.main:cli"
bandhack-commander = "agents.commander.main:cli"
bandhack-planner = "agents.planner.main:cli"
bandhack-coder = "agents.coder.main:cli"
bandhack-documentation-agent = "agents.documentation_agent.main:cli"
bandhack-reviewer = "agents.reviewer.main:cli"
bandhack-orchestrator = "agents.band_orchestrator.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["band", "agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
